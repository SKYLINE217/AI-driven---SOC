[project]
name = "soc-triager"
version = "1.0.0"
description = "SOC Triager - Pure Python security operations automation CLI"
requires-python = ">=3.10"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]   # repo root on path so `from backend.x import y` works

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
