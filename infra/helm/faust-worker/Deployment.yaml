apiVersion: apps/v1
kind: Deployment
metadata:
  name: faust-worker
  labels:
    app: faust-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: faust-worker
  template:
    metadata:
      labels:
        app: faust-worker
    spec:
      containers:
        - name: faust-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["python", "-m", "faust", "-A", "backend.stream.faust_app", "worker", "-l", "info"]
          env:
            - name: KAFKA_BROKER_URL
              value: "kafka://redpanda:9092"
            - name: SCORING_API_URL
              value: "http://scoring-api:8001"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
          livenessProbe:
            exec:
              command: ["python", "-c", "import sys; sys.exit(0)"]
            initialDelaySeconds: 30
            periodSeconds: 60
          readinessProbe:
            exec:
              command: ["python", "-c", "import backend.stream.faust_app; sys.exit(0)"]
            initialDelaySeconds: 15
            periodSeconds: 30
